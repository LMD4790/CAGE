[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cage-code-clone"
version = "0.1.2"
description = "CAGE architecture for multi-view code clone classification"
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = {file = "LICENSE"}
dependencies = [
  "numpy>=1.24,<3",
  "torch>=2.2,<3",
  "transformers>=4.31,<5",
  "scikit-learn>=1.2,<2",
  "lightgbm>=4.3,<5",
  "tree-sitter==0.21.3",
  "tree-sitter-languages==1.10.2",
  "rapidfuzz>=3.9,<4",
  "joblib>=1.3,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
